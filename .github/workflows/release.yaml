name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release
    # Only on main (pushes and manual runs), and not again for the
    # release commit it pushed itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy key pushes the release commit and tag past branch protection.
          ssh-key: ${{ secrets.SEMANTIC_RELEASE_BOT }}
          persist-credentials: true # semantic-release pushes with the deploy key
          fetch-depth: 0 # semantic-release reads all tags and commits

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache in a publishing workflow

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=npm depName=semantic-release
          SEMANTIC_RELEASE_VERSION: 25.0.9
          # renovate: datasource=npm depName=@semantic-release/changelog
          CHANGELOG_PLUGIN_VERSION: 7.0.0
          # renovate: datasource=npm depName=@semantic-release/exec
          EXEC_PLUGIN_VERSION: 7.1.0
          # renovate: datasource=npm depName=@semantic-release/git
          GIT_PLUGIN_VERSION: 11.0.1
          # renovate: datasource=npm depName=conventional-changelog-conventionalcommits
          CONVENTIONALCOMMITS_VERSION: 10.4.0
        run: >-
          npx --yes
          --package "semantic-release@$SEMANTIC_RELEASE_VERSION"
          --package "@semantic-release/changelog@$CHANGELOG_PLUGIN_VERSION"
          --package "@semantic-release/exec@$EXEC_PLUGIN_VERSION"
          --package "@semantic-release/git@$GIT_PLUGIN_VERSION"
          --package "conventional-changelog-conventionalcommits@$CONVENTIONALCOMMITS_VERSION"
          semantic-release

  build-sdk:
    name: Build sdk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install build==1.6.1

      - name: Build distributions
        run: python -m build sdk/python

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-distributions
          path: sdk/python/dist/
          overwrite: true # a re-run of this job replaces its earlier upload

  publish-sdk:
    name: Publish sdk
    needs: build-sdk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/scilog
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-image:
    name: Publish image
    # Main builds :edge, a release tag builds the release; never other branches.
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    strategy:
      matrix:
        component: [api, web]
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read # build from the repository
      id-token: write # sign attestations and cache entries
      packages: write # push to GHCR
    with:
      output: image
      push: true
      context: ${{ matrix.component }}
      target: production
      platforms: linux/amd64,linux/arm64
      sbom: true
      # Cache entries are signed, so only this workflow's own entries are reused.
      cache: true
      cache-scope: ${{ matrix.component }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=edge
        type=sha,enable=${{ github.ref_type == 'branch' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
