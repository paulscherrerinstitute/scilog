name: Semantic Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ssh-key: ${{ secrets.SEMANTIC_RELEASE_BOT }}
                  fetch-depth: 0

            - name: Set up Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.11"

            - name: Install semantic-release
              run: >-
                  npm install -g semantic-release @semantic-release/commit-analyzer 
                  @semantic-release/release-notes-generator @semantic-release/changelog 
                  @semantic-release/git @semantic-release/github @semantic-release/exec 
                  conventional-changelog-conventionalcommits

            - name: Install Python build tools
              run: python -m pip install --upgrade pip build twine

            - name: Run semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
              run: semantic-release
