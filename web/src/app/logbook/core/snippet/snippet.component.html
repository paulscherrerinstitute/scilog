<mat-card
  appearance="raised"
  #snippetContainer
  [ngClass]="styleClass"
  (click)="selectSnippet($event)"
  [@highlightSnippet]="highlightState"
>
  @if (showHeader) {
    <mat-card-header>
      <mat-icon *ngIf="isHighlighted">star</mat-icon>
      <svg
        mat-card-avatar
        [data-jdenticon-value]="avatarHash"
        *ngIf="snippetIsAccessedByAnotherUser && !snippet.isMessage"
        matTooltip="Another user is currently editing this snippet."
      ></svg>
      <mat-card-subtitle>
        <ng-container *ngIf="config?.view?.showSnippetHeader">#{{ indexOrdered }} · </ng-container>
        {{ snippet.createdBy }}
      </mat-card-subtitle>
      <mat-card-subtitle>
        {{ snippet.createdAt | date: 'medium' }}
        @if (isEdited) {
          · edited
        }
      </mat-card-subtitle>
      <ng-container *ngIf="showEditButtonsMenu">
        <button
          mat-icon-button
          [matMenuTriggerFor]="menu"
          aria-label="Example icon-button with a menu"
          class="mat-fab-top-right"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="showInfo()" *ngIf="showInfoButton">
            <mat-icon>info</mat-icon>
            <span>Info</span>
          </button>
          <button
            mat-menu-item
            (click)="editSnippet()"
            [disabled]="!enableEdit.update"
            *ngIf="showEditButtons"
            matTooltip="{{ isActionAllowed.tooltips.update }}"
          >
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
          <button
            mat-menu-item
            (click)="setDashboardName()"
            [disabled]="!enableEdit.update"
            matTooltip="{{ isActionAllowed.tooltips.update }}"
          >
            <mat-icon>assistant</mat-icon>
            <span>Dashboard name</span>
          </button>
          <button mat-menu-item (click)="addComment()" *ngIf="enableComments">
            <mat-icon>note_add</mat-icon>
            <span>Add comment</span>
          </button>
          <button mat-menu-item (click)="addCitation()">
            <mat-icon>reply</mat-icon>
            <span>Reply</span>
          </button>
          <!-- <button mat-menu-item disabled> -->
          <button
            mat-menu-item
            (click)="deleteSnippet()"
            [disabled]="!enableEdit.delete"
            matTooltip="{{ isActionAllowed.tooltips.delete }}"
            *ngIf="showEditButtons"
          >
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
      </ng-container>
    </mat-card-header>
  }

  <mat-card-content>
    <div *ngFor="let snippet of snippet?.subsnippets; let i = index">
      <ng-container *ngIf="snippet?.linkType === 'quote'">
        <app-snippet
          [snippet]="snippet"
          [updatedAt]="snippet?.updatedAt"
          [index]="i"
          [hideMetadata]="hideMetadata"
        ></app-snippet>
      </ng-container>
    </div>
    <!-- <div *ngIf="snippet.quote">
      <snippet [snippet]="snippet.quote" [updatedAt]="snippet.quote?.updatedAt" [index]="index" [linkType]="'QUOTE'" [showEditButtonsMenu]="false"></snippet>
    </div> -->
    <!-- {{index}} -->
    <app-snippet-content
      #snippetContent
      [snippet]="snippet"
      (htmlContent)="updateHtmlContent($event)"
      (isLoading)="setElementLoading($event)"
    >
    </app-snippet-content>
    <div class="snippet-tags-container" *ngIf="!_hideMetadata">
      <span class="snippet-tag" *ngFor="let tag of snippet?.tags">
        {{ tag }}
      </span>
    </div>
  </mat-card-content>
</mat-card>

<div *ngFor="let snippet of snippet?.subsnippets; let i = index">
  <ng-container *ngIf="snippet.linkType !== 'quote' && snippet.snippetType === 'paragraph'">
    <app-snippet
      [snippet]="snippet"
      [updatedAt]="snippet.updatedAt"
      [index]="i"
      [config]="config"
      [hideMetadata]="hideMetadata"
      [subsnippets]="snippet.subsnippets"
    ></app-snippet>
  </ng-container>
</div>
