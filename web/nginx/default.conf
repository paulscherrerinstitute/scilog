# Server block for the Angular SPA. Included from the image's own
# /etc/nginx/nginx.conf, which keeps the upstream defaults for pid and
# temp paths, sendfile, keepalive and logging to stdout/stderr.

# Picks the Cache-Control header from the response status and path, which
# the patterns see as "<status> <path>", e.g. "200 /main.cb6da2df3ac0f5aa.js".
#
# Build files with a content hash in their name never change, so once found
# (200, or 304 when the browser checks its copy) they may be kept for a year.
# Everything else is checked with the server on every load, so a new
# deployment shows up at once: index.html, assets/config.json, files without
# a hash, and errors. A missing hashed file may just not be deployed yet, so
# its 404 must not be kept.
map "$status $uri" $cache_control {
    default                                     "no-cache";
    "~^(200|304) .*\.[0-9a-f]{16,}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kept at server level: an add_header inside a location would drop these
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Angular's static files: a missing one gets a 404, not the start page.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Hashed build output, matched like in the Cache-Control map above.
    location ~ "\.[0-9a-f]{16,}\.[a-z0-9]+$" {
        try_files $uri =404;
    }

    # Every other path is an app route, which Angular's router handles.
    location / {
        try_files $uri /index.html;
    }
}
