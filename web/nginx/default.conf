# Server block for the Angular SPA. Included from the image's own
# /etc/nginx/nginx.conf, which keeps the upstream defaults for pid and
# temp paths, sendfile, keepalive and logging to stdout/stderr.

# Hashed build output never changes, so browsers may keep it forever.
# Everything else (index.html, assets/config.json, unhashed assets) is
# revalidated on every load so a new deployment is picked up at once.
map $uri $cache_control {
    default                        "no-cache";
    "~\.[0-9a-f]{16,}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kept at server level: an add_header inside a location would drop these
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location / {
        try_files $uri /index.html;
    }
}
